<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ContentOS — Control Center</title>
<style>
:root{--bg:#080a0f;--panel:#10131a;--panel2:#151923;--line:#252b38;--text:#f4f6fb;--muted:#8e98aa;--accent:#f4c542;--good:#43d17a;--bad:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}button{font:inherit}.app{display:flex;min-height:100vh}.side{width:240px;border-right:1px solid var(--line);padding:22px 14px;background:#0b0e14;position:fixed;inset:0 auto 0 0}.brand{font-size:21px;font-weight:800;padding:4px 12px 28px}.brand span{color:var(--accent)}nav button{display:block;width:100%;border:0;background:transparent;color:var(--muted);text-align:left;padding:11px 12px;border-radius:8px;cursor:pointer;margin:2px 0}nav button:hover,nav button.active{background:var(--panel2);color:var(--text)}main{margin-left:240px;width:calc(100% - 240px);padding:28px 34px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.eyebrow{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.12em}.title{font-size:28px;font-weight:750;margin-top:5px}.status{border:1px solid #27553a;background:#102217;color:var(--good);padding:8px 12px;border-radius:999px}.status.bad{color:var(--bad);border-color:#5a2828;background:#211010}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}.metric{font-size:28px;font-weight:750;margin-top:9px}.muted{color:var(--muted)}.section{margin-top:24px}.section h2{font-size:16px;margin:0 0 12px}.pipeline{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.stage{padding:14px 10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;text-align:center}.num{font-size:20px;font-weight:700;margin-bottom:5px}.table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.table th,.table td{text-align:left;padding:14px;border-bottom:1px solid var(--line)}.table th{color:var(--muted);font-size:12px;text-transform:uppercase}.score{color:var(--accent);font-weight:700}.page{display:none}.page.active{display:block}.btn{background:var(--accent);color:#111;border:0;border-radius:7px;padding:8px 12px;font-weight:700;cursor:pointer}.notice{padding:12px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;margin-top:12px}@media(max-width:850px){.side{width:70px}.brand{font-size:0}.brand span{font-size:20px}nav button{font-size:0}nav button:before{content:'•';font-size:18px}main{margin-left:70px;width:calc(100% - 70px);padding:20px}.grid{grid-template-columns:repeat(2,1fr)}.pipeline{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><div class="app"><aside class="side"><div class="brand">Content<span>OS</span></div><nav id="nav"><button class="active" data-page="overview">Overview</button><button data-page="research">Research</button><button data-page="ideas">Ideas</button><button data-page="review">Review Queue</button><button data-page="scripts">Scripts</button><button data-page="production">Production</button><button data-page="publishing">Publishing</button><button data-page="analytics">Analytics</button><button data-page="learning">Learning</button><button data-page="automation">Automation</button><button data-page="ai">AI / LLM</button><button data-page="settings">Settings</button></nav></aside><main>
<section class="page active" id="overview"><div class="top"><div><div class="eyebrow">Control Center</div><div class="title">ContentOS Overview</div></div><div id="system-status" class="status">● Connecting</div></div><div class="grid"><div class="card"><div class="muted">Research Items</div><div class="metric" id="research-count">—</div></div><div class="card"><div class="muted">Ideas</div><div class="metric" id="ideas-count">—</div></div><div class="card"><div class="muted">Approved</div><div class="metric" id="approved-count">—</div></div><div class="card"><div class="muted">Published</div><div class="metric" id="published-count">—</div></div></div><div class="section"><h2>Content Pipeline</h2><div class="pipeline"><div class="stage"><div class="num" id="pipe-research">—</div><div class="muted">Research</div></div><div class="stage"><div class="num" id="pipe-ideas">—</div><div class="muted">Ideas</div></div><div class="stage"><div class="num" id="pipe-review">—</div><div class="muted">Review</div></div><div class="stage"><div class="num" id="pipe-scripts">—</div><div class="muted">Scripts</div></div><div class="stage"><div class="num" id="pipe-production">—</div><div class="muted">Production</div></div><div class="stage"><div class="num" id="pipe-published">—</div><div class="muted">Published</div></div></div></div><div class="section"><h2>Top Opportunities</h2><table class="table"><thead><tr><th>Idea</th><th>Topic</th><th>Score</th><th>Status</th></tr></thead><tbody id="ideas-table"><tr><td colspan="4" class="muted">Loading live data…</td></tr></tbody></table></div></section>
<div id="generic"></div></main></div>
<script>
// Change this one value to the final Vercel API hostname after deployment.
const API_BASE = window.CONTENTOS_API_BASE || 'https://content-os.vercel.app';
const content={research:['Research','Evidence sources, discovery runs, freshness and normalized research items.'],ideas:['Ideas','Candidate ideas, transparent scoring, provenance and ranking.'],review:['Review Queue','Human approval gate for ideas and content assets.'],scripts:['Scripts','Outlines, script versions and fact-check status.'],production:['Production','Assets, rendering jobs, outputs and failures.'],publishing:['Publishing','Drafts, schedules, publishing status and platform IDs.'],analytics:['Analytics','Views, CTR, retention, watch time, subscribers and revenue.'],learning:['Learning','Performance signals and reusable content insights.'],automation:['Automation','Queued, running, succeeded and failed jobs.'],ai:['AI / LLM','Provider, model, prompt versions and usage controls.'],settings:['Settings','Channel, workflow, provider and system configuration.']};
function show(name){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));if(name==='overview'){document.getElementById('overview').classList.add('active');return}let [t,d]=content[name];document.getElementById('generic').innerHTML=`<section class="page active"><div class="top"><div><div class="eyebrow">ContentOS</div><div class="title">${t}</div></div><button class="btn" onclick="loadOverview()">Refresh</button></div><div class="card"><h2>${t}</h2><p class="muted">${d}</p><div class="notice">This section is part of the production workflow boundary. Its dedicated API actions will be enabled as the corresponding engine is connected.</div></div></section>`}
async function api(path){const r=await fetch(API_BASE+path,{headers:{Accept:'application/json'}});if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}
async function loadOverview(){try{const [o,ideas]=await Promise.all([api('/api/dashboard/overview'),api('/api/dashboard/ideas?limit=10')]);document.getElementById('research-count').textContent=o.research_items;document.getElementById('ideas-count').textContent=o.ideas;document.getElementById('approved-count').textContent=o.approved;document.getElementById('published-count').textContent=o.published;document.getElementById('pipe-research').textContent=o.research_items;document.getElementById('pipe-ideas').textContent=o.ideas;document.getElementById('pipe-review').textContent=o.review;document.getElementById('pipe-scripts').textContent=o.scripts;document.getElementById('pipe-production').textContent=o.production;document.getElementById('pipe-published').textContent=o.published;document.getElementById('ideas-table').innerHTML=ideas.length?ideas.map(x=>`<tr><td>${escapeHtml(x.title)}</td><td>${escapeHtml(x.topic)}</td><td class="score">${x.overall_score??'—'}</td><td>${escapeHtml(x.status)}</td></tr>`).join(''):'<tr><td colspan="4" class="muted">No ideas yet.</td></tr>';const s=document.getElementById('system-status');s.textContent='● System Healthy';s.className='status'}catch(e){const s=document.getElementById('system-status');s.textContent='● API Offline';s.className='status bad';document.getElementById('ideas-table').innerHTML='<tr><td colspan="4" class="muted">Live API is unavailable. Check the API deployment and CORS configuration.</td></tr>';console.error(e)}}
function escapeHtml(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');show(b.dataset.page)});loadOverview();setInterval(loadOverview,60000);
</script></body></html>
